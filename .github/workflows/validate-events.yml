name: Validate event data

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチへ続けて push したら古い実行は止める（edi-tool/.github の CI テンプレートと同じ）
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-tools.txt

      - name: Install event tooling
        run: python -m pip install -r requirements-tools.txt

      - name: Validate event JSON and assets
        run: python scripts/validate_events.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v
